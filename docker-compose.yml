version: '3.8'

services:
  pos-grocery:
    build: .
    container_name: pos-grocery-app
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRY=${JWT_EXPIRY:-1h}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-7d}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-your-backup-key-change-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8103}
    volumes:
      - pos_data:/app/data
      - pos_backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pos-network

  nginx:
    image: nginx:alpine
    container_name: pos-grocery-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pos-grocery
    restart: unless-stopped
    networks:
      - pos-network

  redis:
    image: redis:7-alpine
    container_name: pos-grocery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - pos-network
    command: redis-server --appendonly yes

volumes:
  pos_data:
    driver: local
  pos_backups:
    driver: local
  redis_data:
    driver: local

networks:
  pos-network:
    driver: bridge